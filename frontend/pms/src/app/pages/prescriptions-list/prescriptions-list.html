<div class="min-h-screen bg-gray-100 p-8">
  <div class="max-w-7xl mx-auto">

    <!-- CARD -->
    <div class="bg-white rounded-2xl shadow-md border border-gray-200">

      <!-- HEADER -->
      <div class="flex flex-col md:flex-row md:items-center md:justify-between p-6 border-b">
        <div>
          <h2 class="text-2xl font-bold text-gray-800">Prescriptions</h2>
          <p class="text-sm text-gray-500">Manage patient prescriptions easily</p>
        </div>

        <button
          (click)="openCreateModal()"
          class="mt-4 md:mt-0 bg-gradient-to-r from-green-500 to-green-600 text-white px-5 py-2.5 rounded-lg text-sm font-medium shadow hover:scale-105 transition"
        >
          + New Prescription
        </button>
      </div>

      <!-- TABLE -->
      <div class="overflow-hidden">
        <div class="overflow-x-auto max-h-[500px]">
          <table class="min-w-full text-sm">

            <!-- HEAD -->
            <thead class="bg-gray-50 sticky top-0">
              <tr class="text-left text-gray-500 uppercase text-xs">
                <th class="px-6 py-3">ID</th>
                <th class="px-6 py-3">Doctor</th>
                <th class="px-6 py-3">Patient</th>
                <th class="px-6 py-3">Date</th>
                <th class="px-6 py-3">Medications</th>
                <th class="px-6 py-3 text-right">Actions</th>
              </tr>
            </thead>

            <!-- BODY -->
            <tbody class="divide-y">

              <tr *ngFor="let p of prescriptions()" class="hover:bg-gray-50 transition">

                <!-- ID -->
                <td class="px-6 py-4 font-medium text-gray-700">
                  #{{ p.id }}
                </td>

                <!-- DOCTOR -->
                <td class="px-6 py-4 text-gray-600">
                  {{ p.doctor?.name || '—' }}
                </td>

                <!-- PATIENT -->
                <td class="px-6 py-4 text-gray-700 font-medium">
                  {{ p.patient?.firstName }} {{ p.patient?.lastName }}
                </td>

                <!-- DATE -->
                <td class="px-6 py-4 text-gray-500">
                  {{ p.issueDate }}
                </td>

                <!-- MEDICATIONS -->
                <td class="px-6 py-4">
                  <div class="flex flex-wrap gap-2">
                    <span 
                      *ngFor="let m of p.medications"
                      class="bg-blue-100 text-blue-700 text-xs px-2 py-1 rounded-full"
                    >
                      {{ m.medication?.name }} ({{ m.dosage }})
                    </span>
                  </div>
                </td>

                <!-- ACTIONS -->
                <td class="px-6 py-4 text-right space-x-2">

                  <button 
                    (click)="openEditModal(p)"
                    class="bg-blue-50 text-blue-600 px-3 py-1.5 rounded-md text-xs font-medium hover:bg-blue-100 transition"
                  >
                    ✏️ Edit
                  </button>

                  <button 
                    (click)="delete(p.id)"
                    class="bg-red-50 text-red-600 px-3 py-1.5 rounded-md text-xs font-medium hover:bg-red-100 transition"
                  >
                    🗑 Delete
                  </button>

                </td>
              </tr>

              <!-- EMPTY STATE -->
              <tr *ngIf="prescriptions().length === 0">
                <td colspan="6" class="py-16 text-center">
                  <div class="flex flex-col items-center text-gray-400">
                    <span class="text-5xl mb-2">📄</span>
                    <p class="text-sm">No prescriptions found</p>
                  </div>
                </td>
              </tr>

            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<app-prescription-modal
  *ngIf="showModal()"
  [prescription]="selectedPrescription()"
  (close)="closeModal()"
  (saved)="load()"
></app-prescription-modal>
