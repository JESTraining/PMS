<div class="min-h-screen bg-gray-100 p-8">
  <div class="max-w-6xl mx-auto bg-white rounded-lg shadow-sm border border-gray-200 p-8">

    <!-- HEADER -->
    <div class="flex justify-between items-center mb-8">
      <h2 class="text-2xl font-semibold text-gray-800">
        Encounters
      </h2>
    </div>

    <!-- TABLE -->
    <div class="overflow-x-auto border border-gray-200 rounded-lg">
      <table class="min-w-full divide-y divide-gray-200">

        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Patient</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Start</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">End</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Reason</th>
            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Action</th>
          </tr>
        </thead>

        <tbody class="bg-white divide-y divide-gray-200">
          <tr *ngFor="let encounter of encounters()" class="hover:bg-gray-50">

            <td class="px-6 py-4 text-sm text-gray-700">
              {{ encounter.patientName }}
            </td>

            <td class="px-6 py-4 text-sm">
              {{ encounter.startTime }}
            </td>

            <td class="px-6 py-4 text-sm">
              {{ encounter.endTime }}
            </td>

            <td class="px-6 py-4 text-sm text-gray-600">
              {{ encounter.encounterReason }}
            </td>

            <td class="px-6 py-4 text-right">
              <button
                (click)="goToDetail(encounter.encounterId)"
                class="text-blue-600 hover:text-blue-800 font-medium"
              >
                Open
              </button>
            </td>

          </tr>

          <tr *ngIf="encounters().length === 0">
            <td colspan="5" class="text-center py-10 text-gray-500 italic">
              No encounters found
            </td>
          </tr>
        </tbody>

      </table>
    </div>

  </div>
</div>
